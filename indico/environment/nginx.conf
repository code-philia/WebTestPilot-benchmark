server {
  # localhost:8080 is the main entrypoint of this docker-compose setup
  listen 8080;
  listen [::]:8080;

  access_log /dev/stdout combined;
  error_log stderr info;

  root       /var/empty;

  sendfile on;

  # Serve static files
  location ~ ^/(images|fonts)(.*)/(.+?)(__v[0-9a-f]+)?\.([^.]+)$ {
    alias /opt/indico/static/$1$2/$3.$5;
  }

  location ~ ^/(css|dist|images|fonts)/(.*)$ {
    alias /opt/indico/static/$1/$2;
  }

  # Indico's admin pages ask PyPI whether a newer Indico exists and then show
  # "A new Indico version ... is available!". Answer with no version data so
  # the banner never appears: tasks must not depend on internet access or on
  # what PyPI publishes on the day.
  location = /admin/version-check {
    default_type application/json;
    return 200 '{}';
  }

  location / {
    # Pass request to the container running Indico
    proxy_pass http://web:59999;
    # Set headers for Indico to receive the correct base URL
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    
  }
}
