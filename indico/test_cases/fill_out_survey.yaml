name: Fill Out Survey
setup_function: login_to_indico
steps: 
- action: From 'All Events' click 'Lecture 2 w/ Survey'
  expectation: The details of the lecture (lecturer, date, venue) is shown
  ground_truth: |
    expect(page.get_by_role("heading", name="Lecture 2 w/ Survey")).to_be_visible()
  url: /event/2
  solution: |
    page.get_by_role("link", name="First Last, \"Lecture 2 w/").click()

- action: Click on 'Fill out' survey
  expectation: Survey form with number, multi-choice, single-choice, text, yes/no, multiline text questions is shown
  ground_truth: |
    expect(page.get_by_role("link", name="Lecture 2 w/ Survey")).to_be_visible()
  url: /event/2/surveys/1
  solution: |
    page.get_by_role("link", name="Fill out").click()

- action: Fill in '33' in 'Number Question' field
  expectation: Number Question field contained filled value
  ground_truth: |
    expect(page.get_by_role("spinbutton", name="Number Question")).to_have_value("33")
  url: /event/2/surveys/1
  solution: |
    page.get_by_role("spinbutton", name="Number Question").fill("33")

- action: Select Options 1, 2, and 3 in Multiple Choice Question
  expectation: Selected options are checked
  ground_truth: |
    [expect(page.get_by_role("checkbox", name=n)).to_be_checked() for n in ["Option 1", "Option 2", "Option 3"]]
  url: /event/2/surveys/1
  solution: |
    page.get_by_role("checkbox", name="Option 1").check()
    page.get_by_role("checkbox", name="Option 2").check()
    page.get_by_role("checkbox", name="Option 3").check()

- action: Scroll the page down
  expectation: The 'Submit' button is visible
  ground_truth: |
    expect(page.get_by_role("button", name="Submit")).to_be_visible()
  url: /event/2/surveys/1
  solution: |
    page.evaluate("window.scrollTo(0, document.body.scrollHeight)")

- action: Select 'Yes' in 'Yes/No Question'
  expectation: The 'Submit' button is visible
  ground_truth: |
    expect(page.locator("#question_6-0")).to_be_checked()
  url: /event/2/surveys/1
  solution: |
    page.get_by_text("Yes", exact=True).click()
    page.get_by_text("Yes", exact=True).check()

- action: Type 'The quick brown fox jumps over the lazy dog' in 'Multiline Text Question' field
  expectation: The 'Multiline Text Question' textarea contains text
  ground_truth: |
    expect(page.get_by_role("textbox", name="Multiline Text Question")).to_have_value("The quick brown fox jumps over the lazy dog")
  url: /event/2/surveys/1
  solution: |
    page.get_by_role("textbox", name="Multiline Text Question").fill("The quick brown fox jumps over the lazy dog")

- action: Click 'Submit'
  expectation: A message indicating 'The survey has been submitted' is visible
  ground_truth: |
    expect(page.get_by_role("link", name="Back to the event")).to_be_visible()
  url: /event/2/surveys
  solution: |
    page.get_by_role("button", name="Submit").click()
