name: Create Conference
setup_function: login_to_indico
steps:
- action: Click 'Create event' in the top navigation bar
  expectation: A dropdown is shown with three options for creating a lecture, a meeting, or a conference
  action_check: |
    expect(page.get_by_role("link", name="Create conference").or_(page.get_by_role("link", name="Conference", exact=True))).to_be_visible()
  url: /
  solution: |
    page.locator("ind-menu").filter(has_text="Create event").click()

- action: Click option to create conference in dropdown
  expectation: A dialog form with title 'Create new conference' is shown (no need to check details)
  action_check: |
    expect(page.get_by_text("Create new conference")).to_be_visible()
  url: /
  solution: |
    page.get_by_role("link", name="Create conference").click()

- action: Type 'New Conference' in 'Event title'
  expectation: Event title field contains typed text
  action_check: |
    expect(page.get_by_role("textbox", name="Event title")).to_have_value("New Conference")
  url: /
  solution: |
    page.get_by_role("textbox", name="Event title").fill("New Conference")

- action: Set 'Protection mode' to 'Public'
  expectation: A dialog form with title 'Create new conference' is shown (no need to check details)
  action_check: |
    expect(page.locator("#form-group-event-creation-protection_mode")).to_contain_text("public")
  url: /
  solution: |
    page.locator("#event-creation-protection_mode").get_by_text("Public").click()

- action: Click 'Create event'
  expectation: An event settings page for the created event is shown
  action_check: |
    expect(page.locator(".title-with-actions")).to_be_visible()
  url: '^\/event\/(19|[2-9]\d|\d{3,})\/manage\/$'
  solution: |
    page.get_by_role("button", name="Create event", exact=True).click()

- action: Click 'Home' in top navigation bar
  expectation: All events list should be equal to initial list plus the created event
  action_check: |
    expect(page.get_by_role("heading", name="All events")).to_be_visible()
  url: /
  solution: |
    page.locator("#global-menu").get_by_role("link", name="Home").click()

assertion_check: |
  # The seeded events plus 'New Conference' (dated today).
  month = lambda name: page.locator("h4").filter(has_text=name).locator("xpath=following-sibling::ul[1]").locator(".event-title a")
  expect(month("January 2025")).to_have_text(['Test Infrastructure Cost Optimization Meeting', 'Meeting 1', 'International Symposium on End-to-End System Validation', 'Accessibility Testing Guidelines Alignment', 'Workshop on LLMs for Software Testing', 'Security & Privacy Review Board', 'Data-Driven Quality Engineering Conference', 'Frontend Testing Strategy Review', 'Program Committee Kickoff – IC-AIT 2026', 'Weekly Software Architecture Sync'])
  expect(month("February 2025")).to_have_text(['International Workshop on Formal Methods for UI Testing', 'Indico Platform Deployment Planning', 'Web Automation & E2E Testing Summit', 'PhD Research Group Monthly Meeting', 'International Conference on AI Testing (IC-AIT 2026)'])
  expect(month("March 2025")).to_have_text(['First Last, "Lecture 2 w/ Survey"', 'Conference 1', 'Admin User, "Lecture 1"'])
  expect(page.locator(".event-title a").filter(has_text=re.compile(r"^\s*" + re.escape('New Conference') + r"\s*$"))).to_have_count(1)
