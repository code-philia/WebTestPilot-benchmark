name: Delete Meeting
setup_function: login_to_indico
steps:
- action: From 'All Events' click 'PhD Research Group Monthly Meeting'
  expectation: The details of the meeting (date, venue) is shown
  action_check: |
    expect(page.get_by_role("heading")).to_contain_text("PhD Research Group Monthly Meeting")
  url: /event/7
  solution: |
    page.get_by_role("link", name="PhD Research Group Monthly").click()

- action: In the top navigation bar, click the pen icon to switch to the event's management area
  expectation: The text 'Advanced options' is visible on the left of the page
  action_check: |
    expect(page.locator("#side-menu-event-management-sidemenu")).to_contain_text("Settings")
  url: /event/7/manage
  solution: |
    page.locator(".i-button.text-color.subtle.icon-edit").first.click()

- action: Click on the gear icon to the right of 'Clone'
  expectation: A dropdown containing 'Delete' action is shown
  action_check: |
    expect(page.get_by_role("button", name="Delete", exact=False)).to_be_visible()
  url: /event/7/manage
  solution: |
    page.locator("#event-management-header-right").get_by_role("button").nth(1).click()

- action: Click on 'Delete' in the dropdown
  expectation: A delete confirmation dialog with title starting with 'You are about to delete the whole event' is shown
  action_check: |
    expect(page.get_by_text("I understand what this means")).to_be_visible()
  url: /event/7/manage
  solution: |
    page.get_by_role("button", name="Delete").click()

- action: Click on 'I understand what this means. Please go ahead.' checkbox
  expectation: Delete event button is enabled
  action_check: |
    expect(page.get_by_role("checkbox", name="I understand what this means")).to_be_checked()
  url: /event/7/manage
  solution: |
    page.get_by_role("checkbox", name="I understand what this means").check()

- action: Click 'Delete event'
  expectation: After deleting an event, the remaining event titles should match the initial “All Events” list with the deleted event removed; for comparison, each title must be normalized by removing an optional organizer prefix followed by a comma and quotation marks if present (i.e., titles may be in the form Organizer, "Event" or just Event), then truncating the resulting title to the first 30 characters.
  action_check: |
    expect(page.get_by_role("heading", name="Events")).to_be_visible()
  url: /category/0/manage
  solution: |
    page.get_by_role("button", name="Delete event").click()
