name: Favourite Meeting
setup_function: login_to_indico
steps:
- action: From 'All Events' click 'PhD Research Group Monthly Meeting'
  expectation: The details of the meeting (date, venue) is shown
  action_check: |
    expect(page.get_by_role("heading")).to_contain_text("PhD Research Group Monthly Meeting")
  url: /event/7
  solution: |
    page.get_by_role("link", name="PhD Research Group Monthly").click()

- action: Click 'Add event to favourites' (star) icon 
  expectation: The details of the conference (date, venue) is shown
  action_check: |
    expect(page.locator("#favorite-link > button.i-button")).to_have_attribute("title", "Delete event from favorites")
  url: /event/7
  solution: |
    page.locator("#favorite-link").get_by_role("button").click()

- action: Click on the 'Home' icon
  expectation: Only the 'PhD Research Group Monthly Meeting' is favourited (indicated by a star next to the title or a red title text) in event list
  action_check: |
    expect(page.get_by_role("heading", name="All events")).to_be_visible()
  url: /
  solution: |
    page.get_by_role("link").nth(1).click()

assertion_check: |
  # Only 'PhD Research Group Monthly Meeting' is favourited: one star in the events list, on that event.
  stars = page.locator(".event-list .event-icons .icon-star, li .event-icons .icon-star")
  expect(stars).to_have_count(1)
  expect(page.locator("li").filter(has=page.locator(".event-icons .icon-star")).locator(".event-title a")).to_have_text(['PhD Research Group Monthly Meeting'])
