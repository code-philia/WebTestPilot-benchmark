name: View Conference Timetable
setup_function: login_to_indico
steps:
- action: From 'All Events' click 'Conference 1'
  expectation: The details of the conference (date, venue) is shown
  action_check: |
    expect(page.locator("#main-content").get_by_text("Registration", exact=True)).to_be_visible()
  url: /event/3
  solution: |
    page.get_by_role("link", name="Conference 1").click()

- action: Click on 'Timetable'
  expectation: An event timetable is shown
  action_check: |
    expect(page.get_by_role("heading", name="Timetable")).to_be_visible()
  url: /event/3/timetable/#20250301
  solution: |
    page.get_by_role("link", name="Timetable").click()

- action: Click on 'Sun 02/03' tab
  expectation: An event timetable is shown
  action_check: |
    expect(page.locator('li[role="tab"][aria-controls="x-tab-2"]')).to_have_attribute("aria-selected", "true")
  url: /event/3/timetable/#20250302
  solution: |
    page.get_by_role("link", name="Sun 02/03").click()

- action: Click on 'Filter' tab
  expectation: Filter options is shown at the bottom
  action_check: |
    expect(page.get_by_role("cell", name="Filter options")).to_be_visible()
  url: /event/3/timetable/#20250302
  solution: |
    page.get_by_text("Filter", exact=True).click()

- action: In filter options, click 'Sessions' dropdown
  expectation: A filter list containing Sessions 1, 2, 3 is shown
  action_check: |
    expect(page.get_by_role("listitem").filter(has_text="Session 1")).to_be_visible()
  url: /event/3/timetable/#20250302
  solution: |
    page.get_by_text("Sessions").click()

- action: Uncheck 'Session 2' in 'Sessions' filter dropdown
  expectation: A filter list containing Sessions 1, 2, 3 is shown
  action_check: |
    expect(page.get_by_role("listitem").filter(has_text="Session 1")).to_be_visible()
  url: /event/3/timetable/#20250302
  solution: |
    page.get_by_role("listitem").filter(has_text="Session 2").click()

- action: Wait
  expectation: Session 2 is no longer visible in the timetable
  action_check: |
    expect(page.locator('li:has(span:text("Session 2")) input[type="checkbox"]')).not_to_be_checked()
  url: /event/3/timetable/#20250302
  solution: |
    page.wait_for_load_state()

assertion_check: |
  # With Session 2 filtered out, no Session 2 block is visible.
  expect(page.locator("#timetable_canvas .timetableBlock").filter(has_text="Session 2").filter(visible=True)).to_have_count(0)
  expect(page.locator("#timetable_canvas .timetableBlock").filter(has_text="Session 1").filter(visible=True)).not_to_have_count(0)
