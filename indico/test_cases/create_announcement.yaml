name: Create Announcement
setup_function: login_to_indico
steps:
- action: Click on 'Administration' in the top navigation bar
  expectation: The 'General Settings' administration page is shown (no need to check details)
  action_check: |
    expect(page.get_by_role("heading", name="General Settings")).to_be_visible()
  url: /admin/settings/
  solution: |
    page.get_by_role("link", name="Administration").click()

- action: Click on 'Homepage' in the sidebar
  expectation: The 'Homepage' section is expanded (no need to check details)
  action_check: |
    expect(page.get_by_role("link", name="Announcement")).to_be_visible()
  url: /admin/settings/
  solution: |
    page.locator("#side-menu-admin-sidemenu div").filter(has_text="Homepage").click()

- action: Click on 'Announcement' under 'Homepage' in the sidebar
  expectation: A page with title 'Announcement' is shown (no need to check details)
  action_check: |
    expect(page.get_by_role("heading", name="Announcement")).to_be_visible()
  url: /admin/announcement
  solution: |
    page.get_by_role("link", name="Announcement").click()

- action: Click on the 'Enabled' toggle button
  expectation: A page with title 'Announcement' is shown (no need to check details)
  action_check: |
    expect(page.get_by_role("checkbox", name="Enabled")).to_be_checked()
  url: /admin/announcement
  solution: |
    page.get_by_role("checkbox", name="Enabled").check()

- action: Type 'Big Announcement' in 'Message' field
  expectation: The 'Message' field contains typed text
  action_check: |
    expect(page.get_by_role("textbox", name="Message")).to_have_value("Big Announcement")
  url: /admin/announcement
  solution: |
    page.get_by_role("textbox", name="Message").fill("Big Announcement")

- action: Click 'Save'
  expectation: A 'Settings have been saved' success message is shown
  action_check: |
    expect(page.get_by_text("Settings have been saved")).to_be_visible()
  url: /admin/announcement
  solution: |
    page.get_by_role("button", name="Save").click()

- action: Click 'Home' in top navigation bar
  expectation: All events list should be equal to initial list
  action_check: |
    expect(page.get_by_role("heading", name="All events")).to_be_visible()
  url: /
  solution: |
    page.locator("#global-menu").get_by_role("link", name="Home").click()

assertion_check: |
  # All seeded events, unchanged.
  month = lambda name: page.locator("h4").filter(has_text=name).locator("xpath=following-sibling::ul[1]").locator(".event-title a")
  expect(month("January 2025")).to_have_text(['Test Infrastructure Cost Optimization Meeting', 'Meeting 1', 'International Symposium on End-to-End System Validation', 'Accessibility Testing Guidelines Alignment', 'Workshop on LLMs for Software Testing', 'Security & Privacy Review Board', 'Data-Driven Quality Engineering Conference', 'Frontend Testing Strategy Review', 'Program Committee Kickoff – IC-AIT 2026', 'Weekly Software Architecture Sync'])
  expect(month("February 2025")).to_have_text(['International Workshop on Formal Methods for UI Testing', 'Indico Platform Deployment Planning', 'Web Automation & E2E Testing Summit', 'PhD Research Group Monthly Meeting', 'International Conference on AI Testing (IC-AIT 2026)'])
  expect(month("March 2025")).to_have_text(['First Last, "Lecture 2 w/ Survey"', 'Conference 1', 'Admin User, "Lecture 1"'])
