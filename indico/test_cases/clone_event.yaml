name: Clonet Event
setup_function: login_to_indico
steps:
- action: From 'All Events' click 'Lecture 1'
  expectation: The details of the lecture (lecturer, date, venue) is shown
  action_check: |
    expect(page.get_by_role("heading", name="Lecture 1")).to_be_visible()
  url: /event/1/
  solution: |
    page.get_by_role("link", name="Admin User, \"Lecture 1\"").click()

- action: In the top navigation bar, click the pen icon to switch to the event's management area
  expectation: A sidebar with 'Advanced Options' tab is shown
  action_check: |
    expect(page.locator("#side-menu-event-management-sidemenu")).to_contain_text("Settings")
  url: /event/1/manage/
  solution: |
    page.locator(".i-button.text-color.subtle.icon-edit").click()

- action: Click 'Clone' button
  expectation: A modal with title 'Clone Event is shown'
  action_check: |
    expect(page.get_by_label("Clone Event").get_by_text("Clone Event")).to_be_visible()
  url: /event/1/manage/
  solution: |
    page.get_by_role("button", name="Clone").click()

- action: Click 'Clone Once'
  expectation: The 'Clone Once' radio button is selected 
  action_check: |
    expect(page.get_by_label("Clone Event").get_by_text("Clone Event")).to_be_visible()
  url: /event/1/manage/
  solution: |
    page.get_by_role("radio", name="Clone Once").check()

- action: Click 'Next'
  expectation: The text 'What should be cloned?' is visible
  action_check: |
    expect(page.get_by_text("What should be cloned?")).to_be_visible()
  url: /event/1/manage/
  solution: |
    page.get_by_role("button", name="Next").click()

- action: Click 'Next'
  expectation: The text 'Where should the events be placed?' is visible
  action_check: |
    expect(page.get_by_text("Where should the events be")).to_be_visible()
  url: /event/1/manage/
  solution: |
    page.get_by_role("button", name="Next").click()

- action: Click 'Next'
  expectation: The text 'Clone Once' is visible
  action_check: |
    expect(page.get_by_text("Clone Once")).to_be_visible()
  url: /event/1/manage/
  solution: |
    page.get_by_role("button", name="Next").click()

- action: Click 'Clone'
  expectation: A success message 'Welcome to your cloned event!' is shown
  action_check: |
    expect(page.locator("div").filter(has_text="Welcome to your cloned event!").nth(5)).to_be_visible()
  url: '^\/event\/(19|[2-9]\d|\d{3,})\/manage\/$'
  solution: |
    page.get_by_role("button", name="Clone").nth(1).click()

- action: Click 'Home' in top navigation bar
  expectation: All events list should be equal to initial list plus the cloned event
  action_check: |
    expect(page.get_by_role("heading", name="All events")).to_be_visible()
  url: /
  solution: |
    page.locator("#global-menu").get_by_role("link", name="Home").click()

assertion_check: |
  # The seeded events plus a clone of 'Lecture 1' (dated today).
  month = lambda name: page.locator("h4").filter(has_text=name).locator("xpath=following-sibling::ul[1]").locator(".event-title a")
  expect(month("January 2025")).to_have_text(['Test Infrastructure Cost Optimization Meeting', 'Meeting 1', 'International Symposium on End-to-End System Validation', 'Accessibility Testing Guidelines Alignment', 'Workshop on LLMs for Software Testing', 'Security & Privacy Review Board', 'Data-Driven Quality Engineering Conference', 'Frontend Testing Strategy Review', 'Program Committee Kickoff – IC-AIT 2026', 'Weekly Software Architecture Sync'])
  expect(month("February 2025")).to_have_text(['International Workshop on Formal Methods for UI Testing', 'Indico Platform Deployment Planning', 'Web Automation & E2E Testing Summit', 'PhD Research Group Monthly Meeting', 'International Conference on AI Testing (IC-AIT 2026)'])
  expect(month("March 2025")).to_have_text(['First Last, "Lecture 2 w/ Survey"', 'Conference 1', 'Admin User, "Lecture 1"'])
  expect(page.locator(".event-title a").filter(has_text=re.compile(r"^\s*" + re.escape('Admin User, "Lecture 1"') + r"\s*$"))).to_have_count(2)
