name: Create News
setup_function: login_to_indico
steps:
- action: Click on 'Administration' in the top navigation bar
  expectation: A message 'A new Indico version...' is shown
  action_check: |
    expect(page.get_by_role("heading", name="General Settings")).to_be_visible()
  url: /admin/settings/
  solution: |
    page.get_by_role("link", name="Administration").click()

- action: Click on 'Homepage' in the sidebar
  expectation: The 'Homepage' section is expanded (no need to check details)
  action_check: |
    expect(page.get_by_role("link", name="Announcement")).to_be_visible()
  url: /admin/settings/
  solution: |
    page.locator("#side-menu-admin-sidemenu div").filter(has_text="Homepage").click()

- action: Click on 'News' under 'Homepage' in the sidebar
  expectation: A page with title 'News' is shown (no need to check details)
  action_check: |
    expect(page.get_by_text("News").nth(2)).to_be_visible()
  url: /admin/news/
  solution: |
    page.get_by_role("link", name="News").click()

- action: Click on the 'Post news' button
  expectation: A modal with title 'Post news' is shown
  action_check: |
    expect(page.get_by_label("Post news").get_by_text("Post news")).to_be_visible()
  url: /admin/news/
  solution: |
    page.get_by_role("button", name="Post news").click()

- action: Type 'Some News' in the 'Title' field
  expectation: The 'Title' field contains typed text
  action_check: |
    expect(page.get_by_role("textbox", name="Title")).to_have_value("Some News");
  url: /admin/news/
  solution: |
    page.get_by_role("textbox", name="Title").fill("Some News")

- action: Type 'News Content' in the 'Content' field
  expectation: The 'Content' field contains typed text
  action_check: |
    expect(page.locator("iframe[title=\"Rich Text Area\"]").content_frame.get_by_role("paragraph")).to_contain_text("News Content")
  url: /admin/news/
  solution: |
    page.locator("iframe[title=\"Rich Text Area\"]").content_frame.get_by_label("Rich Text Area. Press ALT-0").fill("News Content")
    # Indico copies the editor into its hidden form field after a short delay.
    expect(page.locator("input#content")).not_to_have_value("")

- action: Scroll the page down
  expectation: A 'Save' button is visible
  action_check: |
    expect(page.get_by_role("button", name="Save")).to_be_visible()
  url: /admin/news/
  solution: |
    page.evaluate("window.scrollTo(0, document.body.scrollHeight)")
  
- action: Click 'Save'
  expectation: A 'News 'Some News' has been posted' success message is shown
  action_check: |
    expect(page.locator("div").filter(has_text="News 'Some News' has been").nth(4)).to_be_visible()
  url: /admin/news/
  solution: |
    page.get_by_role("button", name="Save").click()

- action: Click 'Home' in top navigation bar
  expectation: All events list should be equal to initial list
  action_check: |
    expect(page.get_by_role("heading", name="All events")).to_be_visible()
  url: /
  solution: |
    page.locator("#global-menu").get_by_role("link", name="Home").click()
