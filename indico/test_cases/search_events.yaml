name: Search Events
setup_function: login_to_indico
steps:
- action: Type 'test' as query in search bar
  expectation: Search bar contains typed text 
  action_check: |
    expect(page.get_by_role("textbox", name="Search Indico ADMIN Skip")).to_have_value("test")
  url: /
  solution: |
    page.get_by_role("textbox", name="Search Indico").fill("test")

- action: Press 'Enter'
  expectation: Page with title 'Search' is shown (no need to check details)
  action_check: |
    expect(page.get_by_role("heading", name="Search").or_(page.get_by_role("heading", name="Find Events"))).to_be_visible()
  url: /search/?q=test
  solution: |
    page.get_by_role("textbox", name="Search Indico ADMIN Skip").press("Enter")

- action: Wait
  expectation: All entries in the search results contain “test” in the event title (case-insensitive).
  action_check: |
    expect(page.get_by_role("heading", name="Search").or_(page.get_by_role("heading", name="Find Events"))).to_be_visible()
  url: /search/?q=test
  solution: |
    page.wait_for_load_state()
