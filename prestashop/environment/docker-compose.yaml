services:
  webapp:
    build:
      context: .
      dockerfile: app.Dockerfile
    platform: linux/x86_64
    environment:
      - PS_DEV_MODE=0
      - PS_INSTALL_AUTO=1
      - PS_DOMAIN=webapp
      - ADMIN_MAIL=admin@admin.com
      - ADMIN_PASSWD=admin12345
      - PS_FOLDER_ADMIN=webtestpilot
      - DB_SERVER=db
      - DB_USER=root
      - DB_PASSWD=root
      - DB_NAME=prestashop
    volumes:
      - app_webroot:/var/www/html
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80"]
      interval: 3s
      timeout: 10s
      retries: 120
      start_period: 120s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    platform: linux/x86_64
    image: mysql:5.7
    command: >
      --innodb-purge-threads=1
      --innodb-log-file-size=32M
      --innodb-log-buffer-size=8M
      --log-error-verbosity=1
    environment:
      MYSQL_DATABASE: prestashop
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 2s
      timeout: 5s
      retries: 25
    restart: unless-stopped

  browser:
    build:
      context: .
      dockerfile: browser.Dockerfile
    environment:
      - INJECT_BUG=${INJECT_BUG:-false}
      - SETUP_FUNCTION=${SETUP_FUNCTION:-$setup_fn_default}
      - APP_URL=http://webapp:80
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - PYTHONUNBUFFERED=1
    volumes:
      - ./init.py:/init.py:ro
      - ./bug.js:/bug.js:ro
      - ./bug_injector.js:/bug_injector.js:ro
    command: python3 /init.py
    depends_on:
      webapp:
        condition: service_healthy
      seed-loader:
        condition: service_completed_successfully
      user-creator:
        condition: service_completed_successfully
    restart: unless-stopped

  seed-loader:
    image: mysql:5.7
    volumes:
      - ./seed.sql:/seed.sql:ro
      - ./seed-loader.sh:/seed-loader.sh:ro
    command: bash /seed-loader.sh
    depends_on:
      webapp:
        condition: service_healthy
    restart: "no"

  user-creator:
    build:
      context: .
      dockerfile: app.Dockerfile
    platform: linux/x86_64
    entrypoint: ["php"]
    command: /var/www/html/tools/create_user.php
    volumes:
      - app_webroot:/var/www/html
    depends_on:
      seed-loader:
        condition: service_completed_successfully
    restart: "no"

volumes:
  db:
  app_webroot:
