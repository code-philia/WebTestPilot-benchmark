name: Buyer View New Product Details
setup_function: login_to_prestashop_as_buyer
steps:
- action: Scroll the page down
  expectation: A page full of products is shown (no need to check details)
  action_check: |
    expect(page.get_by_role("link", name="Mug The best is yet to come").first).to_be_visible()
  url: /
  solution: |
    page.evaluate("window.scrollBy(0, window.innerHeight)")

- action: Scroll the page down
  expectation: A on sale products section is shown (no need to check details)
  action_check: |
    expect(page.get_by_role("heading", name="On sale")).to_be_visible()
  url: /
  solution: |
    page.evaluate("window.scrollBy(0, window.innerHeight)")

- action: Scroll the page down
  expectation: A new products section is shown (no need to check details)
  action_check: |
    expect(page.get_by_role("heading", name="New products")).to_be_visible()
  url: /
  solution: |
    page.evaluate("window.scrollBy(0, window.innerHeight)")

- action: Click on the 'Hummingbird Printed T-Shirt'
  expectation: A product page with title 'Hummingbird Printed T-Shirt', price, description, and comments section (no comments) is shown
  action_check: |
    expect(page.get_by_role("heading", name="Hummingbird Printed T-Shirt")).to_be_visible()
  url: /men/1-1-hummingbird-printed-t-shirt.html#/1-size-s/8-color-white
  solution: |
    page.get_by_role("link", name="Hummingbird printed t-shirt").nth(3).click()

- action: Click on the 'Home' breadcrumb
  expectation: The products shown is consistent before and after user activity
  action_check: |
    expect(page.get_by_role("heading", name="Popular Products")).to_be_visible()
  url: /
  solution: |
    page.get_by_role("link", name="Home").click()
