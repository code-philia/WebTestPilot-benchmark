name: Buyer Sort Products by Name Z to A
setup_function: login_to_prestashop_as_buyer
steps:
- action: Click 'Art' tab in the navigation bar
  expectation: A grid of products under 'Art' category is shown (no need to check details)
  action_check: |
    expect(page.get_by_role("heading", name="Art")).to_be_visible()
  url: /9-art
  solution: |
    page.get_by_role("link", name="Art", exact=True).click()

- action: Click on 'Studio Design' in the 'Brands' sidebar
  expectation: A list of products by brand 'Studio Design' is shown (no need to check details)
  action_check: |
    expect(page.locator("h1")).to_contain_text("List of products by brand Studio Design")
  url: /brand/1-studio-design
  solution: |
    page.get_by_role("link", name="Studio Design").click()

- action: Click on 'Sort by' dropdown
  expectation: A dropdown of sort options is shown
  action_check: |
    expect(page.get_by_role("link", name="Name, Z to A")).to_be_visible()
  url: /brand/1-studio-design
  solution: |
    page.get_by_role("button", name="Sort by selection").click()

- action: Click on 'Name, Z to A' option
  expectation: The products are correctly sorted by 'Name, Z to A', and must be extracted in row-major order (left-to-right within each row, top-to-bottom across rows) (no need to get image)
  action_check: |
    expect(page.get_by_label("Sort by selection")).to_contain_text("Name, Z to A")
  url: /brand/1-studio-design
  solution: |
    page.get_by_role("link", name="Name, Z to A").click()

assertion_check: |
  # The brand's 9 products, by name Z to A.
  names = page.locator(".js-product .product-description .product-title a")
  expect(names).to_have_text(['Mug Today is a good day', 'Mug The best is yet to come', 'Mug The adventure begins', 'Mountain fox cushion', 'Hummingbird printed t-shirt', 'Hummingbird printed sweater', 'Hummingbird cushion', 'Customizable mug', 'Brown bear cushion'])
