name: Buyer Contact Us
setup_function: login_to_prestashop_as_buyer
steps:
- action: Click on 'Contact us' in the top navigation bar
  expectation: A form with title 'Contact us' and an 'OUR COMPANY' section in the footer is shown (no need to check other details) 
  action_check: |
    expect(page.get_by_role("heading", name="Store information")).to_be_visible()
  url: /contact-us
  solution: |
    page.locator("#contact-link").get_by_role("link", name="Contact us").click()

- action: Type 'Checkout issues' in the 'Message' field
  expectation: Message field contains typed text
  action_check: |
    expect(page.get_by_role("textbox", name="Message")).to_have_value("Checkout issues")
  url: /contact-us
  solution: |
    page.get_by_role("textbox", name="Message").fill("Checkout issues")

- action: Click 'Send'
  expectation: A success message is shown
  action_check: |
    expect(page.get_by_role("textbox", name="Message")).not_to_be_visible()
  url: /contact-us
  solution: |
    page.get_by_role("button", name="Send").click()
