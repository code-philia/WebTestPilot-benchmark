name: Buyer Remove Product from Cart
setup_function: login_to_prestashop_as_buyer
steps:
- action: Click 'Cart' button
  expectation: A list of products in cart is shown
  action_check: |
    expect(page.get_by_role("heading", name="Shopping Cart")).to_be_visible()
  url: /cart?action=show
  solution: |
    page.get_by_role("link", name="Shopping cart link containing").click()

- action: Click on the 'Delete' icon of the first product
  expectation: The list of cart products should be equal to initial list minus the deleted product
  action_check: |
    expect(page.locator("#cart-subtotal-products")).to_contain_text("3 items")
  url: /cart?action=show
  solution: |
    page.get_by_role("link", name="delete").first.click()

assertion_check: |
  # The seeded cart minus the removed t-shirt.
  items = page.locator("ul.cart-items > li.cart-item")
  expect(items).to_have_count(3)
  for i, name in enumerate(['Mountain fox notebook', 'Brown bear cushion', 'Hummingbird printed sweater']):
      expect(items.nth(i)).to_contain_text(name)
