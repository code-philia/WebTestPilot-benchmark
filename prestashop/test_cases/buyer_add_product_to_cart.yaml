name: Buyer Add Product to Cart
setup_function: login_to_prestashop_as_buyer
steps:
- action: Click 'Cart' button
  expectation: A list of products in cart is shown (no need to check details)
  action_check: |
    expect(page.get_by_role("heading", name="Shopping Cart")).to_be_visible()
  url: /cart?action=show
  solution: |
    page.get_by_role("link", name="Shopping cart link containing").click()

- action: Click on 'Accessories' tab in navigation bar
  expectation: A list of products is shown (no need to check details)
  action_check: |
    expect(page.get_by_role("heading", name="Accessories", exact=True)).to_be_visible()
  url: /6-accessories
  solution: |
    page.get_by_role("link", name="Accessories", exact=True).click()

- action: Scroll the page down
  expectation: A list of products is shown (no need to check details)
  action_check: |
    expect(page.get_by_text("Mug The adventure begins")).to_be_visible()
  url: /6-accessories
  solution: |
    page.evaluate("window.scrollBy(0, window.innerHeight)")

- action: Click on the 'Mug The Adventure Begins' product
  expectation: A product page with title 'Mug The Adventure Begins', price, description, and comments section (no comments) is shown
  action_check: |
    expect(page.get_by_role("heading", name="Mug The adventure begins")).to_be_visible()
  url: /home-accessories/7-mug-the-adventure-begins.html
  solution: |
    page.get_by_role("link", name="Mug The adventure begins").first.click()

- action: Click 'Add to Cart' button
  expectation: A dialog with title 'Product successfully added to your shopping cart' is shown
  action_check: |
    expect(page.get_by_role("button", name="Continue shopping")).to_be_visible()
  url: /home-accessories/7-mug-the-adventure-begins.html
  solution: |
    page.get_by_role("button", name="Add to cart").first.click()

- action: Click on 'Proceed to Checkout'
  expectation: After adding a product, the shopping cart contains all previous items plus exactly one additional item
  action_check: |
    expect(page.get_by_role("heading", name="Shopping Cart")).to_be_visible()
  url: /cart?action=show
  solution: |
    page.get_by_role("link", name="Proceed to checkout").first.click()

assertion_check: |
  # The seeded cart plus exactly one added product.
  items = page.locator("ul.cart-items > li.cart-item")
  expect(items).to_have_count(5)
  for i, name in enumerate(['Hummingbird printed t-shirt', 'Mountain fox notebook', 'Brown bear cushion', 'Hummingbird printed sweater', 'Mug The adventure begins']):
      expect(items.nth(i)).to_contain_text(name)
