name: Buyer View Popular Product Details
setup_function: login_to_prestashop_as_buyer
steps:
- action: Scroll the page down
  expectation: A page full of products is shown
  action_check: |
    expect(page.get_by_role("link", name="Mug The best is yet to come").first).to_be_visible()
  url: /
  solution: |
    page.evaluate("window.scrollBy(0, window.innerHeight)")

- action: Click on the 'The Best Is Yet To Come' mug
  expectation: Product details page with comments section is shown
  action_check: |
    expect(page.get_by_role("heading", name="Mug The best is yet to come")).to_be_visible()
  url: /home-accessories/6-mug-the-best-is-yet-to-come.html
  solution: |
    page.get_by_text("Mug The best is yet to come").click()

- action: Click on the 'Home' breadcrumb
  expectation: The products shown is consistent before and after user activity
  action_check: |
    expect(page.get_by_role("heading", name="Popular Products")).to_be_visible()
  url: /
  solution: |
    page.locator(".breadcrumb").get_by_role("link", name="Home", exact=True).click()
