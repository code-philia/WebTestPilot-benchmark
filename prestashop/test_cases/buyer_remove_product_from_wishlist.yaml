name: Buyer Remove Product from Wishlist
setup_function: login_to_prestashop_as_buyer
steps:
- action: Click on 'Auto Customer' in the top navigation bar
  expectation: A page with title 'Your account' is shown (no need to check details)
  action_check: |
    expect(page.get_by_role("heading", name="Your account")).to_be_visible()
  url: /my-account
  solution: |
    page.get_by_role("link", name="Auto Customer").click()

- action: Click on 'My Wishlists'
  expectation: A list of wishlist folder(s) is shown
  action_check: |
    expect(page.get_by_role("heading", name="My wishlists")).to_be_visible()
  url: /module/blockwishlist/lists
  solution: |
    page.get_by_role("link", name="favorite My wishlists").click()

- action: Click on the center of the white container with 'My wishlist (4)'
  expectation: A grid of wishlisted products is shown (no need to check details)
  action_check: |
    expect(page.get_by_role("heading", name="My wishlist")).to_be_visible()
  url: /module/blockwishlist/view?id_wishlist=1
  solution: |
    page.get_by_text("My wishlist (4) share").click()

- action: Click on the 'Delete' icon for the first product
  expectation: A dialog box with title 'Remove product from wishlist' is shown
  action_check: |
    expect(page.get_by_role("heading", name="Remove product from wishlist")).to_be_visible()
  url: /module/blockwishlist/view?id_wishlist=1
  solution: |
    page.locator(".wishlist-product").first.get_by_role("button", name="delete").click()

- action: Click on 'Remove'
  expectation: The grid of wishlisted products should be equal to initial list minus the deleted product
  action_check: |
    expect(page.locator("h1")).to_contain_text("My wishlist (3)")
  url: /module/blockwishlist/view?id_wishlist=1
  solution: |
    page.get_by_role("button", name="Remove").click()

assertion_check: |
  # The 4 wishlisted products minus the first one.
  products = page.locator("ul.wishlist-products-list > li .wishlist-product-title")
  expect(products).to_have_text(["Mug The adventure begins", "Mug Today is a good day", "Brown bear cushion"])
