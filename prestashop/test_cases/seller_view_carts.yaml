name: Seller View Carts
setup_function: login_to_prestashop_as_seller
steps:
- action: Click on 'Active Shopping Carts' link in dashboard
  expectation: The shopping cart table (excluding abandoned carts) is consistent with active cart numbers in dashboard
  action_check: |
    expect(page.get_by_role("heading", name="Shopping Carts").or_(page.get_by_role("heading", name="Active Baskets"))).to_be_visible()
  url: '^/webtestpilot/index\.php\?controller=AdminCarts&token=[^&#]+$'
  solution: |
    page.get_by_role("link", name="Active Shopping Carts").click()

assertion_check: |
  # 6 carts: the 5 ordered carts counted as active on the dashboard, and one abandoned cart.
  carts = page.locator("#table-cart tbody tr")
  expect(carts).to_have_count(6)
  expect(carts.filter(has_text="Abandoned cart")).to_have_count(1)
