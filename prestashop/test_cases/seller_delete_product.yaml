name: Seller Delete Product
setup_function: login_to_prestashop_as_seller
steps:
- action: Click on 'Catalog' in sidebar
  expectation: The page contains title 'Dashboard'
  action_check: |
    expect(page.locator("#subtab-AdminProducts").get_by_role("link", name="Products")).to_be_visible()
  url: '^/webtestpilot/index\.php\?controller=AdminDashboard&token=[^&#]+$'
  solution: |
    page.wait_for_load_state("networkidle")
    page.get_by_role("link", name="store Catalog").click()

- action: Click on 'Products' under 'Catalog'
  expectation: A products list is shown (no need to check details)
  action_check: |
    expect(page.get_by_role("heading", name="Products", exact=True)).to_be_visible()
  url: '^/webtestpilot/index\.php/sell/catalog/products-v2/\?_token=[^&#]+$'
  solution: |
    page.get_by_role("link", name="Products", exact=True).click()

- action: Click on the ID 19, which is the first product
  expectation: The product details page with 'Product name' and 'Summary' is shown 
  action_check: |
    expect(page.get_by_role("heading", name="Summary")).to_be_visible()
  url: '^/webtestpilot/index\.php/sell/catalog/products-v2/19/edit\?_token=[^&#]+$'
  solution: |
    page.get_by_role("cell", name="19", exact=True).click()

- action: At the bottom of the page, next to 'Go to catalog' button, click triple dots
  expectation: A dropdown containing 'Delete' is shown
  action_check: |
    expect(page.get_by_role("button", name="delete Delete")).to_be_visible()
  url: '^/webtestpilot/index\.php/sell/catalog/products-v2/19/edit\?_token=[^&#]+$'
  solution: |
    page.locator("#product_footer_actions_dropdown").click()

- action: Click on 'Delete' option 
  expectation: A dialog with title 'Permanently delete this product?' is shown
  action_check: |
    expect(page.get_by_role("heading", name="Permanently delete this")).to_be_visible()
  url: '^/webtestpilot/index\.php/sell/catalog/products-v2/19/edit\?_token=[^&#]+$'
  solution: |
    page.get_by_role("button", name="delete Delete").click()

- action: Click on 'Delete'
  expectation: The products list should be equal to initial list minus the delete product
  action_check: |
    expect(page.get_by_text("Successful deletion")).to_be_visible()
  url: '^/webtestpilot/index\.php/sell/catalog/products-v2/\?_token=[^&#]+$'
  solution: |
    page.get_by_role("button", name="Delete").click()

assertion_check: |
  # The 19 seeded products minus the deleted 'Customizable mug' (id 19).
  rows = page.locator("table tbody tr")
  expect(rows).to_have_count(18)
  expect(rows.first).to_contain_text("Hummingbird notebook")
  expect(rows.last).to_contain_text("Hummingbird printed t-shirt")
  expect(page.locator("table tbody").get_by_text("Customizable mug")).to_have_count(0)
