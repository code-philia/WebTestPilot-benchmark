name: Recently Viewed Page
setup_function: login_to_bookstack
steps:
- action: From the dashboard click "Books" link in navigation
  expectation: Books listing page appears
  action_check: |
    expect(page.get_by_role("heading", name="Books", exact=True)).to_be_visible()
  url: /books
  solution: |
    page.get_by_role("link", name="Books", exact=True).click()

- action: Click on book title "Book2"
  expectation: Book detail page opens
  action_check: |
    expect(page.get_by_role("heading", name="Book2")).to_be_visible()
  url: /books/book2
  solution: |
    page.get_by_role("link", name="Book2 Description Created").click()

- action: Click on page title "Page 1"
  expectation: Page detail page opens
  action_check: |
    expect(page.locator("#bkmrk-page-title")).to_contain_text("Page 1")
  url: /books/book2/page/page-1
  solution: |
    page.get_by_role("link", name="Page 1 Page Description").click()

- action: Click on the Bookstack logo top left of navbar
  expectation: The 'Book2' and 'Page 1' item appears at the top of the "My Recently Viewed" list, whether it was already present or newly added. All other items retain their previous order
  action_check: |
    expect(page.locator("#recently-viewed")).to_contain_text("Page 1")
  url: /
  solution: |
    page.get_by_role("link", name="Logo BookStack").click()
