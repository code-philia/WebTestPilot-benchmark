name: Search
setup_function: login_to_bookstack
steps:
- action: Click on search icon button
  expectation: Search results page appear with 'Update Search' button
  ground_truth: |
    expect(page.get_by_role("heading", name="Search Results")).to_be_visible()
  url: /search?term=
  solution: |
    page.get_by_role("button", name="Search").click()

- action: Click on 'Books' link in navigation
  expectation: Books listing page is shown
  ground_truth: |
    expect(page.get_by_role("heading", name="Books", exact=True)).to_be_visible()
  url: /books
  solution: |
    page.get_by_role("link", name="Books", exact=True).click()

- action: Click on book title 'Book2'
  expectation: The chapters and pages in 'Book2' is consistent with previous search results
  ground_truth: |
    expect(page.get_by_role("heading", name="Book2")).to_be_visible()
  url: /books/book2
  solution: |
    page.get_by_role("link", name="Book2 Description Created").click()
