name: Delete Book
setup_function: login_to_bookstack
steps:
- action: From the dashboard click 'Books' link in navigation
  expectation: Books listing page appears
  action_check: |
    expect(page.get_by_role("heading", name="Books", exact=True)).to_be_visible()
  url: /books
  solution: |
    page.get_by_role("link", name="Books", exact=True).click()

- action: Click on book title 'Book2'
  expectation: Page contains title 'Book2'
  action_check: |
    expect(page.get_by_role("heading", name="Book2")).to_be_visible()
  url: /books/book2
  solution: |
    page.get_by_role("link", name="Book2 Description Created").click()

- action: Click on 'Delete''
  expectation: Delete confirmation page is shown
  action_check: |
    expect(page.get_by_role("heading", name="Delete Book")).to_be_visible()
  url: /books/book2/delete
  solution: |
    page.get_by_role("link", name="Delete").click()

- action: Click on 'Confirm''
  expectation: The books list before deletion equals the books list after deletion plus exactly the deleted book (book titles only).
  action_check: |
    expect(page.get_by_role("main")).not_to_contain_text("Book2")
  url: /books
  solution: |
    page.get_by_role("button", name="Confirm").click()

assertion_check: |
  # The books list is the seeded books minus the deleted 'Book2'.
  expect(page.locator("main .grid-card h2")).to_have_text(["Book", "Book1"])
