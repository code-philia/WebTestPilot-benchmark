name: Favourite Page
setup_function: login_to_bookstack
steps:
- action: Click 'Shelves' link in navigation
  expectation: The shelves list is shown
  action_check: |
    expect(page.get_by_role("heading", name="Shelves", exact=True)).to_be_visible()
  url: /shelves
  solution: |
    page.get_by_role("link", name="Shelves").click()

- action: Click on my profile icon
  expectation: A dropdown with profile options with 'My Favourites' appears
  action_check: |
    expect(page.get_by_role("link", name="My Favourites")).to_be_visible()
  url: /shelves
  solution: |
    page.get_by_label("Profile Menu").get_by_role("img", name="Admin").click()

- action: Click on My Favourites option
  expectation: The favourites list is shown
  action_check: |
    expect(page.get_by_role("heading", name="My Favourites")).to_be_visible()
  url: /favourites
  solution: |
    page.get_by_role("link", name="My Favourites").click()

- action: Click 'Books' link in navigation
  expectation: Books listing page appears
  action_check: |
    expect(page.get_by_role("heading", name="Books", exact=True)).to_be_visible()
  url: /books
  solution: |
    page.get_by_role("link", name="Books", exact=True).click()

- action: Click on book title 'Book2'
  expectation: Page contains title 'Book2'
  action_check: |
    expect(page.get_by_role("heading", name="Book2")).to_be_visible()
  url: /books/book2
  solution: |
    page.get_by_role("link", name="Book2 Description Created").click()

- action: Click on chapter title 'Page 1'
  expectation: Page contains title 'Page 1'
  action_check: |
    expect(page.locator("#bkmrk-page-title")).to_contain_text("Page 1")
  url: /books/book2/page/page-1
  solution: |
    page.get_by_role("link", name="Page 1 Page Description").click()

- action: Click on the Favourite button
  expectation: The 'Unfavourite' button is present
  action_check: |
    expect(page.get_by_role("button", name="Unfavourite")).to_be_visible()
  url: /books/book2/page/page-1
  solution: |
    page.get_by_role("button", name="Favourite").click()

- action: Click on my profile icon
  expectation: A dropdown with profile options with 'My Favourites' appears
  action_check: |
    expect(page.get_by_role("link", name="My Favourites")).to_be_visible()
  url: /books/book2/page/page-1
  solution: |
    page.get_by_label("Profile Menu").get_by_role("img", name="Admin").click()

- action: Click on My Favourites option
  expectation: The favourites list is equal to the previous list with exactly one newly favourited item, 'Page 1', added
  action_check: |
    expect(page.get_by_role("main")).to_contain_text("Page 1")
  url: /favourites
  solution: |
    page.get_by_role("link", name="My Favourites").click()

assertion_check: |
  # The seeded favourites plus 'Page 1' (Book2's).
  expect(page.locator("main .entity-list-item-name")).to_have_text(["Book1", "Chapter 2", "Page 1", "Shelf", "Page 1"])
