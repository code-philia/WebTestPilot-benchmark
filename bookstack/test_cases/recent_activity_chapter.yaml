name: Recent Activity Chapter
setup_function: login_to_bookstack
steps:
- action: From the dashboard click 'Chapter 2' link
  expectation: The 'Recent Activity' (user, activity, timestamp data) consistent with the previous dashboard's 'Recent Activity' list
  action_check: |
    expect(page.get_by_role("heading", name="Details").or_(page.get_by_role("heading", name="Info"))).to_be_visible()
  url: '^\/books\/book[12]\/chapter\/chapter-2$'
  solution: |
    page.get_by_role("link", name="Chapter").first.click()

assertion_check: |
  # The chapter's created/updated times match the dashboard's activity (created within the last day).
  times = page.locator(".entity-meta span").filter(has_text=re.compile(r"ago"))
  expect(times).to_have_count(2)
  for i in range(2):
      expect(times.nth(i)).to_have_text(re.compile(r"^\d+ (seconds?|minutes?|hours?) ago$|^1 day ago$"))
