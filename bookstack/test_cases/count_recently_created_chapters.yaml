name: Count Recently Created Chapters
setup_function: login_to_bookstack
steps:
- action: Click on my profile icon
  expectation: A dropdown with profile options with 'View Profile' appears
  action_check: |
    expect(page.get_by_role("link", name="View Profile")).to_be_visible()
  url: /
  solution: |
    page.get_by_label("Profile Menu").get_by_role("img", name="Admin").click()

- action: Click on 'View Profile' option
  expectation: There exists a 'Recently Created Chapters' section that is consistent with 'Created Content' counts
  action_check: |
    expect(page.get_by_text("Created Content")).to_be_visible()
  url: /user/admin
  solution: |
    page.get_by_role("link", name="View Profile").click()

assertion_check: |
  # 'Created Content' counts 4 chapters; 'Recently Created Chapters' lists exactly those 4.
  expect(page.locator("section:has(h2#recent-chapters) .entity-list-item-name")).to_have_text(["Chapter 2", "Chapter 1", "Chapter 2", "Chapter"])
