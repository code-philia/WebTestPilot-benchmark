name: Recent Activity All
setup_function: login_to_bookstack
steps:
- action: Click on my profile icon
  expectation: A dropdown with profile options with 'View Profile' appears
  action_check: |
    expect(page.get_by_role("link", name="View Profile")).to_be_visible()
  url: /
  solution: |
    page.get_by_label("Profile Menu").get_by_role("img", name="Admin").click()

- action: Click on 'View Profile' option
  expectation: The 'Recent Activity' list is in chronological order
  action_check: |
    expect(page.get_by_role("heading", name="Recent Activity")).to_be_visible()
  url: /user/admin
  solution: |
    page.get_by_role("link", name="View Profile").click()

assertion_check: |
  # Every activity is from the seeded content (hours or days ago), newest first; nothing is months or years old.
  times = page.locator("#recent-user-activity .activity-list-item .text-muted small")
  expect(times).to_have_count(15)
  expect(times).not_to_contain_text([re.compile(r"month|year")])
  for i in range(14):
      expect(times.nth(i)).to_have_text(re.compile(r"^\d+ (seconds?|minutes?|hours?) ago$|^1 day ago$"))
