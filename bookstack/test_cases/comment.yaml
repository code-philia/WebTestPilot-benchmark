name: Comment
setup_function: login_to_bookstack
steps:
- action: From the dashboard click 'Page Template' link
  expectation: Page contains title 'Page Template'
  ground_truth: |
    expect(page.locator("#bkmrk-page-title")).to_match_aria_snapshot("- heading \"Page Template\" [level=1]")
  url: /books/book/page/page-template
  solution: |
    page.locator("#recently-viewed").get_by_role("link", name="Page Template").click()

- action: Scroll the page down
  expectation: A list of comments is present
  ground_truth: |
    expect(page.get_by_role("button", name="Add Comment")).to_be_visible()
  url: /books/book/page/page-template
  solution: |
    page.evaluate("window.scrollTo(0, document.body.scrollHeight)")

- action: Click 'Add Comment'
  expectation: A WYSIWYG comment editor is open
  ground_truth: |
    expect(page.get_by_label("Comments")).to_match_aria_snapshot("- application:\n  - group:\n    - group:\n      - toolbar:\n        - button \"Bold\":\n          - img\n        - button \"Italic\":\n          - img\n        - button \"Insert/edit link\":\n          - img\n        - button \"Bullet list\":\n          - img\n        - button \"Numbered list\":\n          - img\n  - iframe\n- button \"Cancel\"\n- button \"Save Comment\"")
  url: /books/book/page/page-template
  solution: |
    page.get_by_role("button", name="Add Comment").click()

- action: Scroll the page down
  expectation: "'Save Comment' and 'Cancel' buttons are present"
  ground_truth: |
    expect(page.get_by_role("button", name="Save Comment")).to_be_visible()
  url: /books/book/page/page-template
  solution: |
    page.evaluate("window.scrollTo(0, document.body.scrollHeight)")

- action: In the 'Leave a comment here' field, type 'I like this template'
  expectation: Editor box is not empty
  ground_truth: |
    expect(
        page.locator('iframe[title="Rich Text Area"]').content_frame.get_by_text("I like this template")
    ).to_be_visible()
  url: /books/book/page/page-template
  solution: |
    page.locator("iframe[title=\"Rich Text Area\"]").content_frame.get_by_label("Rich Text Area. Press ALT-0").fill("I like this template")
    
- action: Click 'Save Comment'
  expectation: The current comments tree is equal to the initially observed comments tree with the addition of exactly one new comment, and no other structural or content changes
  ground_truth: | 
    expect(page.locator("#comment6")).to_contain_text("I like this template")
  url: /books/book/page/page-template
  solution: |
    page.get_by_role("button", name="Save Comment").click()
