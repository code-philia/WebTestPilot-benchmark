name: Recent Activity Shelf
setup_function: login_to_bookstack
steps:
- action: From the dashboard click 'Shelf' link in 'Recent Activity'
  expectation: The details of the 'Shelf' item in the current 'Recent Activity' list (user, action, and timestamp) are identical to those recorded in the previous dashboard's 'Recent Activity' list
  action_check: |
    expect(page.get_by_role("heading", name="Details").or_(page.get_by_role("heading", name="Info"))).to_be_visible()
  url: /shelves/shelf
  solution: |
    page.locator("#recent-activity").get_by_role("link", name="Shelf").click()

assertion_check: |
  # The shelf's details and its activity show the same recent times (created within the last day).
  times = page.locator("#details span, #recent-activity span.text-muted small").filter(has_text=re.compile(r"ago"))
  expect(times).to_have_count(3)
  for i in range(3):
      expect(times.nth(i)).to_have_text(re.compile(r"^\d+ (seconds?|minutes?|hours?) ago$|^1 day ago$"))
