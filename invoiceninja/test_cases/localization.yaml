name: Localization
setup_function: login_to_invoiceninja
steps:
- action: From the dashboard click the company logo on the top left
  expectation: A dropdown containing 'Account Management' option is shown
  action_check: |
    expect(page.get_by_text("Account Management")).to_be_visible()
  url: /dashboard
  solution: |
    page.get_by_role("button", name="Company logo Untitled Company").click()

- action: Click on 'Account Management' option
  expectation: Page with title 'Account Management' is shown
  action_check: |
    expect(page.get_by_role("heading", name="Account Management")).to_be_visible()
  url: /settings/account_management
  solution: |
    page.get_by_text("Account Management").click()

- action: Click on 'Localization' in the sidebar
  expectation: The currency three-letter code and the date format (in Python strftime) are consistent with the dashboard
  action_check: |
    expect(page.get_by_role("heading", name="Localization")).to_be_visible()
  url: /settings/localization
  solution: |
    page.get_by_role("link", name="Localization").click()

assertion_check: |
  # The dashboard uses USD and dates like 06/Oct/2026 (%d/%b/%Y).
  values = page.locator(".css-ood9ll-singleValue")
  expect(values.filter(has_text="Dollar")).to_have_text(["US Dollar (USD)"])
  expect(values.filter(has_text=re.compile(r"\d{4}"))).to_have_text([re.compile(r"^\d{2}/[A-Z][a-z]{2}/\d{4}$")])
