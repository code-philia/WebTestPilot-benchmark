name: Convert Quote to Invoice
setup_function: login_to_invoiceninja
steps:
- action: Click 'Invoices' in the sidebar
  expectation: A table of invoices is displayed (no need to check columns)
  action_check: |
    expect(page.get_by_role("heading", name="Invoices")).to_be_visible()
  url: /invoices
  solution: |
    page.get_by_role("link", name="Invoices", exact=True).click()

- action: Click 'Quotes' in the sidebar
  expectation: A table of quotes is displayed (no need to check columns)
  action_check: |
    expect(page.get_by_role("heading", name="Quotes")).to_be_visible()
  url: /quotes
  solution: |
    page.get_by_role("link", name="Quotes").click()

- action: Click on the 'Status' dropdown
  expectation: A dropdown containing 'Sent' option is shown
  action_check: |
    expect(page.get_by_role("option", name="Sent")).to_be_visible()
  url: /quotes
  solution: |
    page.locator("[class$=-container]").filter(has_text="Status").locator("input[id^=react-select]").click()

- action: Click on the 'Sent' option
  expectation: The 'Sent' status tag is visible
  action_check: |
    expect(page.get_by_role("option", name="Sent")).not_to_be_visible()
  url: /quotes
  solution: |
    page.get_by_role("option", name="Sent").click()
  
- action: Click on the "Actions" button for quote number '123456' in the table
  expectation:  A dropdown containing 'Convert to Invoice' option is shown
  action_check: |
    expect(page.get_by_role("button", name="Convert to Invoice")).to_be_visible()
  url: /quotes
  solution: |
    page.get_by_role("table").get_by_role("button", name="Actions").click()

- action: Click on the 'Convert to Invoice' button
  expectation: The 'Convert to Invoice' button is not visible and its dropdown is no longer expanded
  action_check: |
    expect(page.get_by_text("Converted").first).to_be_visible()
  url: /quotes
  solution: |
    page.get_by_role("button", name="Convert to Invoice").click()

- action: Click 'Invoices' in the sidebar
  expectation: The invoice table should contain all previous invoices with the same invoice number, client, amount, and date, plus one new invoice corresponding to the converted quote, which must match on client and amount (other fields may differ), so that the total row count is exactly one more than before
  action_check: |
    expect(page.get_by_role("heading", name="Invoices")).to_be_visible()
  url: /invoices
  solution: |
    page.get_by_role("link", name="Invoices", exact=True).click()

assertion_check: |
  # The seeded invoices keep their number, amount, and date; the converted quote adds one invoice (client and amount match the quote).
  rows = page.locator("table tbody tr")
  expect(rows).to_have_count(5)
  seeded = [("123456", "$ 120,000.00", "07/Oct/2025"), ("123456_sent", "$ 120,000.00", "07/Oct/2025"), ("123456_draft", "$ 120,000.00", "07/Oct/2025"), ("123456_past_due", "$ 60,000.00", "01/Jan/1970")]
  for i, (number, amount, date) in enumerate(seeded):
      cells = rows.nth(i).locator("td")
      expect(cells.nth(2)).to_have_text(number)
      expect(cells.nth(4)).to_have_text(amount)
      expect(cells.nth(6)).to_have_text(date)
  new = rows.nth(4).locator("td")
  expect(new.nth(3)).to_have_text("company_name")
  expect(new.nth(4)).to_have_text("$ 720,000.00")
