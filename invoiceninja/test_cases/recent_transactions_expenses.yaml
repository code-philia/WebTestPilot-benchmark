name: Recent Transactions Expenses
setup_function: login_to_invoiceninja
steps:
- action: From the dashboard click 'Expenses' in the sidebar
  expectation: A table of expenses is shown (no need to check columns)
  action_check: |
    expect(page.get_by_role("heading", name="Expenses")).to_be_visible()
  url: /expenses
  solution: |
    page.get_by_role("link", name="Expenses", exact=True).click()

- action: Click 'Enter Expense' button
  expectation: Enter expense form with taxes panel is shown
  action_check: |
    expect(page.get_by_role("heading", name="Enter Expense")).to_be_visible()
  url: /expenses/create
  solution: |
    page.get_by_role("link", name="Enter Expense").click()

- action: Type '120000' in 'Amount'
  expectation: Amount field contains typed text
  action_check: |
    expect(page.get_by_role("textbox").first).to_have_value("120,000")
  url: /expenses/create
  solution: |
    page.get_by_role("textbox").first.fill("120000")

- action: Click 'Save'
  expectation: Expense total panel is shown
  action_check: |
    expect(page.get_by_text("Expense Total")).to_be_visible()
  url: '^\/expenses\/([A-Za-z0-9]+)\/edit$'
  solution: |
    page.get_by_role("button", name="Save").click()

- action: Click on 'Dashboard' in the sidebar
  expectation: Invoices, payments, expenses, and outstanding in 'Recent Transactions' in dashboard is equal to before plus the new expense
  action_check: |
    expect(page.get_by_role("heading", name="Dashboard")).to_be_visible()
  url: /dashboard
  solution: |
    page.get_by_role("link", name="Dashboard").click()

assertion_check: |
  # This period's figures: the new $120,000 expense, and no invoices, payments, or outstanding amounts.
  figure = lambda label: page.locator("div.flex.justify-between.items-center").filter(has=page.locator("span.text-gray-500", has_text=re.compile("^" + re.escape(label) + "$")))
  expect(figure("Expenses")).to_contain_text("$ 120,000.00")
  expect(figure("Invoices")).to_contain_text("$ 0.00")
  expect(figure("Payments")).to_contain_text("$ 0.00")
  expect(figure("Outstanding")).to_contain_text("$ 0.00")
  expect(figure("Total Invoices Outstanding")).to_contain_text("0")
