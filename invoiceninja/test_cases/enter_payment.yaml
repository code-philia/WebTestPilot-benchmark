name: Enter Payment
setup_function: login_to_invoiceninja
steps:
- action: Click 'Payments' in the sidebar
  expectation: A table of payments is shown (no need to check columns)
  action_check: |
    expect(page.get_by_role("heading", name="Payments")).to_be_visible()
  url: /payments
  solution: |
    page.get_by_role("link", name="Payments").click()

- action: Click 'Enter Payment'
  expectation: A form with title 'Enter Payment' is shown (no need to check fields)
  action_check: |
    expect(page.get_by_role("heading", name="Create Payment")).to_be_visible()
  url: /payments/create
  solution: |
    page.get_by_role("link", name="Enter Payment").click()

- action: Click 'company_name' in client dropdown
  expectation: Client field contains clicked option
  action_check: |
    expect(page.locator("form")).to_match_aria_snapshot("- term: Client\n- definition:\n  - combobox: company_name\n  - button")
  url: /payments/create
  solution: |
    page.get_by_role("option", name="company_name").click()

- action: Type '60000' in 'Amount Received'
  expectation: Amount received field contained typed value
  action_check: |
    expect(page.get_by_role("textbox").first).to_have_value("60,000")
  url: /payments/create
  solution: |
    page.locator("div:has(> dt > span:text-is('Amount received'))").get_by_role("textbox").fill("60000")

- action: Scroll the page down
  expectation: The 'Payment Type' field with 'Select...' placeholder is present
  action_check: |
    expect(page.get_by_text("Payment Type")).to_be_visible()
  url: /payments/create
  solution: |
    page.evaluate("window.scrollTo(0, document.body.scrollHeight)")

- action: Click on 'Payment Type' dropdown field
  expectation: A list of payment types is shown
  action_check: |
    expect(page.get_by_role("option", name="American Express")).to_be_visible()
  url: /payments/create
  solution: |
    page.locator("div:has(> dt > span:text-is('Payment Type'))").locator("input[id^=react-select]").click()

- action: Select 'American Express' as payment type
  expectation: Payment type field contains selected option
  action_check: |
    expect(page.locator("form")).to_contain_text("American Express")
  url: /payments/create
  solution: |
    page.get_by_role("option", name="American Express").click()

- action: Click 'Save'
  expectation: The payment type should be what was selected earlier
  action_check: |
    expect(page.get_by_role("heading", name="Edit Payment")).to_be_visible()
  url: '^\/payments\/([A-Za-z0-9]+)\/edit$'
  solution: |
    page.get_by_role("button", name="Save").click()

assertion_check: |
  # The saved payment keeps the selected payment type.
  expect(page.locator("div:has(> dt > span:text-is('Payment Type'))").locator(".css-ood9ll-singleValue")).to_have_text("American Express")
