name: Upcoming Quotes
setup_function: login_to_invoiceninja
steps:
- action: From the dashboard click 'Quotes' in the sidebar
  expectation: The 'Sent' quote number(s) is consistent with 'Upcoming Quotes' on the dashboard
  action_check: |
    expect(page.get_by_role("heading", name="Quotes")).to_be_visible()
  url: /quotes
  solution: |
    page.get_by_role("link", name="Quotes", exact=True).click()

assertion_check: |
  # The quotes table holds the 3 seeded quotes; the one 'Sent' quote is the dashboard's Upcoming Quotes.
  rows = page.locator("table tbody tr")
  expect(rows).to_have_count(3)
  for i, number in enumerate(['123456_expired', '123456', '0001']):
      expect(rows.nth(i).locator("td").filter(has_text=re.compile(r"^\s*" + re.escape(number) + r"\s*$"))).to_have_count(1)
