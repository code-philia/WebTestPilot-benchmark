name: Disable Invoices Module
setup_function: login_to_invoiceninja
steps:
- action: From the dashboard click the company logo on the top left
  expectation: A dropdown containing 'Account Management' option is shown
  action_check: |
    expect(page.get_by_text("Account Management")).to_be_visible()
  url: /dashboard
  solution: |
    page.get_by_role("button", name="Company logo Untitled Company").click()

- action: Click on 'Account Management' option
  expectation: Page with title 'Account Management' in top bar is shown
  action_check: |
    expect(page.get_by_role("heading", name="Account Management")).to_be_visible()
  url: /settings/account_management
  solution: |
    page.get_by_text("Account Management").click()

- action: Click on 'Enabled Modules' tab
  expectation: Enabled Modules section with toggle buttons is shown
  action_check: |
    expect(page.get_by_role("heading", name="Enabled Modules")).to_be_visible()
  url: /settings/account_management/enabled_modules
  solution: |
    page.get_by_role("link", name="Enabled Modules").click()

- action: Click on the first and second toggle buttons ('Invoices', 'Recurring Invoices') in 'Enabled Modules'
  expectation: Both 'Invoices' and 'Recurring Invoices' toggle button are untoggled
  action_check: |
    def expect_switch(label_text, expected_state: bool):
        dt = page.locator(f"dt:has(> span:text-is('{label_text}'))")
        button = dt.locator("xpath=following-sibling::dd//button[@role='switch']")
        expect(button).to_have_attribute("aria-checked", str(expected_state).lower())

    expect_switch("Invoices", False)
    expect_switch("Recurring Invoices", False)
  url: /settings/account_management/enabled_modules
  solution: |
    page.locator("div:has(> dt > span:text-is('Invoices'))").get_by_role("switch").click()
    page.locator("div:has(> dt > span:text-is('Recurring Invoices'))").get_by_role("switch").click()

- action: Click on 'Save' button
  expectation: The 'Invoices' and 'Recurring Invoices' options are no longer in the sidebar
  action_check: |
    [
      expect(page.get_by_role("link", name="Invoices", exact=True)).not_to_be_visible(),
      expect(page.get_by_role("link", name="Recurring Invoices")).not_to_be_visible()
    ]
  url: /settings/account_management/enabled_modules
  solution: |
    page.get_by_role("button", name="Save").click()

- action: Click on 'Dashboard' in the sidebar
  expectation: The 'Upcoming Invoices', 'Past Due Invoices', and 'Upcoming Recurring Invoices' are no longer visible in the dashboard
  action_check: |
    expect(page.get_by_role("heading", name="Dashboard")).to_be_visible()
  url: /dashboard
  solution: |
    page.get_by_role("link", name="Dashboard").click()

assertion_check: |
  # With the Invoices modules disabled, their dashboard panels are gone; the others remain.
  for title in ["Upcoming Invoices", "Past Due Invoices", "Upcoming Recurring Invoices"]:
      expect(page.locator("h3", has_text=title)).to_have_count(0)
  expect(page.locator("h3", has_text="Upcoming Quotes")).to_have_count(1)
