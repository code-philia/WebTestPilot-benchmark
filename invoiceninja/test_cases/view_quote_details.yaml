name: View Quote Details
setup_function: login_to_invoiceninja
steps:
- action: From the dashboard click 'Quotes' in the sidebar
  expectation: A table of quotes is shown
  action_check: |
    expect(page.get_by_role("heading", name="Quotes")).to_be_visible()
  url: /quotes
  solution: |
    page.get_by_role("link", name="Quotes").click()

- action: Click on the quote number '123456'
  expectation: The quoted products calculation is consistent with subtotal 
  action_check: |
    expect(page.get_by_role("heading", name="Edit Quote")).to_be_visible()
  url: /quotes/Wpmbk5ezJn/edit
  solution: |
    page.get_by_role("link", name="123456", exact=True).click()

assertion_check: |
  # The quoted products add up to the 720,000 subtotal.
  totals = page.locator("form").filter(has_text="Subtotal").first
  expect(totals.locator("dt", has_text="Subtotal").locator("xpath=following-sibling::dd[1]")).to_have_text("$ 720,000.00")
