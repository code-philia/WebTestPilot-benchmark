name: Expired Quotes
setup_function: login_to_invoiceninja
steps:
- action: From the dashboard click 'Quotes' in the sidebar
  expectation: The 'Expired' quote number(s) is consistent with 'Expired Quotes' on the dashboard
  action_check: |
    expect(page.get_by_role("heading", name="Quotes")).to_be_visible()
  url: /quotes
  solution: |
    page.get_by_role("link", name="Quotes").click()
