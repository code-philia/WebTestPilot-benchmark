name: View Invoice Details
setup_function: login_to_invoiceninja
steps:
- action: From the dashboard click 'Invoices' in the sidebar
  expectation: A table of invoices is shown
  action_check: |
    expect(page.get_by_role("heading", name="Invoices")).to_be_visible()
  url: /invoices
  solution: |
    page.get_by_role("link", name="Invoices", exact=True).click()

- action: Click the invoice number '123456'
  expectation: The invoiced products calculation is consistent with subtotal 
  action_check: |
    expect(page.get_by_role("heading", name="Edit Invoice")).to_be_visible()
  url: /invoices/VolejRejNm/edit
  solution: |
    page.get_by_role("link", name="123456", exact=True).click()

assertion_check: |
  # The invoiced products add up to the 120,000 subtotal.
  totals = page.locator("form").filter(has_text="Subtotal").first
  expect(totals.locator("dt", has_text="Subtotal").locator("xpath=following-sibling::dd[1]")).to_have_text("$ 120,000.00")
