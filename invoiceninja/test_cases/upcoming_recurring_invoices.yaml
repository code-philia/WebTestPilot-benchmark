name: Upcoming Recurring Invoices
setup_function: login_to_invoiceninja
steps:
- action: From the dashboard click 'Recurring Invoices' in the sidebar
  expectation: The table of invoice number(s) is consistent with 'Upcoming Recurring Invoices' on the dashboard
  action_check: |
    expect(page.get_by_role("heading", name="Recurring Invoices")).to_be_visible()
  url: /recurring_invoices
  solution: |
    page.get_by_role("link", name="Recurring Invoices").click()

assertion_check: |
  # The recurring invoices table holds the one invoice in the dashboard's Upcoming Recurring Invoices.
  rows = page.locator("table tbody tr")
  expect(rows).to_have_count(1)
  for i, number in enumerate(['123456']):
      expect(rows.nth(i).locator("td").filter(has_text=re.compile(r"^\s*" + re.escape(number) + r"\s*$"))).to_have_count(1)
