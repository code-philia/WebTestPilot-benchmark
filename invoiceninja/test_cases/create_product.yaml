name: Create Product
setup_function: login_to_invoiceninja
steps:
- action: Click 'Products' in the sidebar
  expectation: A table of products is shown (no need to check columns)
  action_check: |
    expect(page.get_by_role("heading", name="Products")).to_be_visible()
  url: /products
  solution: |
    page.get_by_role("link", name="Products").click()

- action: Click on 'New Product' button
  expectation: A form with title 'New Product' is shown (no need to check fields)
  action_check: |
    expect(page.get_by_role("link", name="New Product")).to_be_visible()
  url: /products/create
  solution: |
    page.get_by_role("link", name="New Product").click()

- action: Type 'New Product' in 'Item' field
  expectation: Item field contains typed text
  action_check: |
    expect(page.get_by_role("textbox").first).to_have_value("New Product")
  url: /products/create
  solution: |
    page.get_by_role("textbox").first.fill("New Product")

- action: Type '120' in 'Price' field
  expectation: Price field contains typed text
  action_check: |    
    expect(page.get_by_role("textbox").nth(2)).to_have_value("120")
  url: /products/create
  solution: |
    page.get_by_role("textbox").nth(2).fill("120")

- action: Type '1' in 'Default Quantity' field
  expectation: Default quantity field contains typed text
  action_check: |    
    expect(page.get_by_role("textbox").nth(3)).to_have_value("1")
  url: /products/create
  solution: |
    page.get_by_role("textbox").nth(3).fill("1")

- action: Click on 'Save'
  expectation: A new 'Status' field appears in form with 'Active' tag. Tax field is consistent with previous form.
  action_check: |
    expect(page.get_by_text("Active")).to_be_visible()
  url: '^\/products\/([A-Za-z0-9]+)\/edit$'
  solution: |
    page.get_by_role("button", name="Save").click()

assertion_check: |
  # The saved product is Active and keeps the default tax category.
  expect(page.get_by_text("Active", exact=True)).to_be_visible()
  expect(page.locator("div:has(> dt > span:text-is('Tax Category'))").locator(".css-ood9ll-singleValue")).to_have_text("Physical Goods")
