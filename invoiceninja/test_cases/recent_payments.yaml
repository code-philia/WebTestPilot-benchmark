name: Recent Payments
setup_function: login_to_invoiceninja
steps:
- action: From the dashboard click 'Payments' in the sidebar
  expectation: The 'Completed' payment number(s) in the Payments table exactly matches the 'Completed' payments shown in the Recent Payments panel on the dashboard
  action_check: |
    expect(page.get_by_role("heading", name="Payments")).to_be_visible()
  url: /payments
  solution: |
    page.get_by_role("link", name="Payments").click()

assertion_check: |
  # The payments table holds the one 'Completed' payment shown in the dashboard's Recent Payments.
  rows = page.locator("table tbody tr")
  expect(rows).to_have_count(1)
  for i, number in enumerate(['0001']):
      expect(rows.nth(i).locator("td").filter(has_text=re.compile(r"^\s*" + re.escape(number) + r"\s*$"))).to_have_count(1)
