services:
  webapp:
    image: invoiceninja/invoiceninja-debian:5.11.61-d
    restart: unless-stopped
    environment:
      - APP_URL=http://nginx:80
      - APP_KEY=base64:RR++yx2rJ9kdxbdh3+AmbHLDQu+Q76i++co9Y8ybbno=
      - APP_ENV=production
      - APP_DEBUG=false
      - REQUIRE_HTTPS=false
      - PDF_GENERATOR=snappdf
      - TRUSTED_PROXIES=*
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=ninja
      - DB_USERNAME=ninja
      - DB_PASSWORD=ninja
      - DB_CONNECTION=mysql
      - IN_USER_EMAIL=admin@admin.com
      - IN_PASSWORD=password
    volumes:
      - app_cache:/var/www/html/bootstrap/cache
      - app_public:/var/www/html/public
      - app_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - app_public:/var/www/html/public:ro
      - app_storage:/var/www/html/storage:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80"]
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 90s
    depends_on:
      - webapp

  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ninja
      MYSQL_USER: ninja
      MYSQL_PASSWORD: ninja
      MYSQL_ROOT_PASSWORD: ninjaAdm1nPassword
    volumes:
      - mysql:/var/lib/mysql
      - ./baseline.sql:/docker-entrypoint-initdb.d/00-baseline.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uninja", "-pninja"]
      interval: 2s
      timeout: 5s
      retries: 25

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 25

  browser:
    build:
      context: .
      dockerfile: browser.Dockerfile
    environment:
      - INJECT_BUG=${INJECT_BUG:-false}
      - SETUP_FUNCTION=${SETUP_FUNCTION:-$setup_fn_default}
      - APP_URL=http://nginx:80
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - PYTHONUNBUFFERED=1
    volumes:
      - ./init.py:/init.py:ro
      - ./bug.js:/bug.js:ro
      - ./bug_injector.js:/bug_injector.js:ro
    command: python3 /init.py
    depends_on:
      nginx:
        condition: service_healthy
      seed-loader:
        condition: service_completed_successfully
    restart: unless-stopped

  seed-loader:
    image: mysql:8
    volumes:
      - ./seed.sql:/seed.sql:ro
      - ./seed-loader.sh:/seed-loader.sh:ro
    command: bash /seed-loader.sh
    depends_on:
      nginx:
        condition: service_healthy
    restart: "no"

volumes:
  app_cache:
  app_public:
  app_storage:
  mysql:
  redis:
